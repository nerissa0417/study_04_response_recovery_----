horizon_days: 60
time_step: day
inventory_buffer_rule: consume_then_stockout
record_item_history: true
enable_supply_tracking: true
enable_demand_tracking: true
enable_fusion_tracking: true
track_network_state: true
demand_model:
  backlog_threshold: 0.95
  lost_threshold: 0.5
  backlog_retention_ratio: 0.8
  target_service_level: 0.95
fusion_model:
  failure_supply_states:
  - unavailable
  - blocked
  failure_demand_states:
  - lost
  affected_supply_states:
  - degraded
  affected_demand_states:
  - backlog
backup_supplier_switch:
  enabled: true
  switch_time_days: 7
  backup_capacity_factor: 0.75
  setup_cost: 1200
  qualification_cost_per_day: 180
  activation_cost: 600
equivalent_material_substitution:
  enabled: true
  switch_time_days: 3
  alt_capacity_factor: 0.6
  setup_cost: 800
  activation_cost: 450
  material_premium_factor: 0.15
priority_repair:
  enabled: true
  repair_lead_days: 5
  max_parallel_repairs: 1
  priority_rule: supplier_impact
  key_node_bonus_weight: 3.0
  supplier_repair_cost: 2200
  material_repair_cost: 1100
  activation_cost: 300
standardization:
  min_augmented_backup_cases: 3
  synthetic_switch_time_days: 7
  synthetic_qualification_time_days: 5
  synthetic_backup_capacity_factor: 0.7
incident_duration_days:
  交付延误: 5
  断供: 14
  系统故障: 7
  质量事故: 10
  自然灾害: 21
incident_severity:
  交付延误: 0.5
  断供: 1.0
  系统故障: 0.8
  质量事故: 0.7
  自然灾害: 1.0
bayesian_model:
  enabled: true
  use_sampling: false
  random_seed: 42
  edge_propagation:
    disrupted_base: 0.9
    degraded_base: 0.55
    low_inventory_bonus: 0.15
    no_backup_bonus: 0.1
    key_node_bonus: 0.2
  supplier_network_propagation:
    disrupted_base: 0.65
    degraded_base: 0.35
    high_risk_bonus: 0.1
    key_node_bonus: 0.1
    disrupt_threshold: 0.7
    degrade_threshold: 0.35
    propagated_degrade_floor: 0.25
