horizon_days: 60
time_step: day
inventory_buffer_rule: consume_then_stockout
record_item_history: true
enable_supply_tracking: true
enable_demand_tracking: true
enable_fusion_tracking: true
track_network_state: true
demand_model:
  backlog_threshold: 0.95
  lost_threshold: 0.5
  backlog_retention_ratio: 0.8
  target_service_level: 0.95
fusion_model:
  failure_supply_states:
  - unavailable
  - blocked
  failure_demand_states:
  - lost
  affected_supply_states:
  - degraded
  affected_demand_states:
  - backlog
supply_status:
  available_threshold: 0.95
backup_supplier_switch:
  enabled: true
  switch_time_days: 7
  trigger_supply_factor: 0.95
  backup_capacity_factor: 0.75
  setup_cost: 1200
  qualification_cost_per_day: 180
  activation_cost: 600
equivalent_material_substitution:
  enabled: true
  switch_time_days: 3
  alt_capacity_factor: 0.6
  setup_cost: 800
  activation_cost: 450
  material_premium_factor: 0.15
priority_repair:
  enabled: true
  repair_lead_days: 5
  max_parallel_repairs: 1
  priority_rule: supplier_impact
  key_node_bonus_weight: 3.0
  supplier_repair_cost: 2200
  material_repair_cost: 1100
  activation_cost: 300
standardization:
  min_augmented_backup_cases: 0
  default_inventory_days: 12
  synthetic_switch_time_days: 7
  synthetic_qualification_time_days: 5
  synthetic_backup_capacity_factor: 0.7
supply_source_roles:
  licensed_backup_capacity_factor: 0.85
  licensed_backup_priority: 10
  licensed_qualification_time_days: 0
  potential_backup_capacity_factor: 0.65
  potential_backup_priority: 20
  potential_qualification_time_days: 5
  capability_fallback_capacity_factor: 0.6
  capability_fallback_priority: 30
  capability_fallback_qualification_time_days: 5
critical_nodes:
  mode: random_if_no_manual
  random_seed: 42
  random_item_count: 8
  include_final_product: false
incident_duration_days:
  交付延误: 5
  断供: 14
  系统故障: 7
  质量事故: 10
  自然灾害: 21
incident_severity:
  交付延误: 0.5
  断供: 1.0
  系统故障: 0.8
  质量事故: 0.7
  自然灾害: 1.0
bayesian_model:
  mode: deterministic
  enabled: false
  use_sampling: false
  random_seed: 42
  disruption:
    prior: 0.15
    severity_weight: 1.2
    incident_weight: 0.15
    compliance_penalty: 0.4
    qms_penalty: 0.25
    risk_level_factor:
      low: 0.8
      medium: 1.0
      high: 1.3
  edge_propagation:
    disrupted_base: 0.9
    degraded_base: 0.55
    low_inventory_days_threshold: 3
    low_inventory_bonus: 0.15
    no_backup_bonus: 0.1
    key_node_bonus: 0.2
    propagation_threshold: 0.5
  supplier_network_propagation:
    disrupted_base: 0.45
    degraded_base: 0.22
    low_resilience_bonus: 0.15
    high_incident_bonus: 0.08
    key_supplier_bonus: 0.12
    degrade_threshold: 0.35
    disrupt_threshold: 0.8
    min_capacity_factor: 0.25
