# 场景模板配置。
# 当前正式实验只保留两类情境对应的两个核心场景：
# 1. 随机中断情境 -> 随机普通节点分散中断
# 2. 关键节点中断情境 -> keynodes 清单中 is_critical=1 的关键供应商同时中断
scenarios:
  - scenario_id: default_random_distributed_node_disruption
    scenario_type: random_distributed_node_disruption
    target_type: node_group
    target_id: AUTO_RANDOM_NONCRITICAL_NODES
    start_date: 2025-06-15
    duration_days: 14
    severity: 1.0
    description: Fixed-seed distributed disruption on ordinary non-critical supplier and item nodes.
    extra:
      random_seed: 42
      desired_node_count: 4
      supplier_node_count: 2
      item_node_count: 2
  - scenario_id: default_keynode_distributed_disruption
    scenario_type: keynode_distributed_disruption
    target_type: supplier_group
    target_id: AUTO_KEY_SUPPLIERS
    start_date: 2025-06-15
    duration_days: 18
    severity: 1.0
    description: Simultaneous disruption on suppliers marked as critical in Input_data/keynodes.
